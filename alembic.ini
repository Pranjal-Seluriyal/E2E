# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration files
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, prefixed by ',' or ';'
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone = UTC

# version table name
# version_locations = %(here)s/bar:%(here)s/bat

# logging configuration is managed separately or below

[post_write_hooks]
# post_write_hooks allows scripts to be run after a migration is generated
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REFN

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
